name: Kernel Build Workflow

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model to build"
        required: false
        default: "d1xks"
        type: choice
        options:
        - d1xks

jobs:
  build_d1xks:
    runs-on: ubuntu-24.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev libc6-dev-i386 x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig zstd wget cpio
      - uses: actions/checkout@v4
        with:
          repository: Ocin4ever/ExtremeKernel
          ref: sixteen
          submodules: 'recursive'
      - name: Update submodules
        run: |
          git submodule update --init --recursive
          git submodule update --remote
      - name: Build for d1xks (sixteen, clang r547379)
        run: |
          git log -1 --format='%H %s'
          ./build.sh -m d1xks -k y -r n || { echo "== diag"; ls toolchain; ld.lld -v; exit 1; }
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExtremeKRNL-Nexus-sixteen-d1xks
          path: |
            build/out/d1xks/boot.img
            build/out/d1xks/dtb.img
            build/out/d1xks/dtbo.img
