name: Kernel Build Workflow

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model to build"
        required: false
        default: "d1xks"
        type: choice
        options:
        - d1xks

jobs:
  build_d1xks:
    runs-on: ubuntu-24.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev libc6-dev-i386 x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig zstd wget cpio
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: Update submodules
        run: |
          git submodule update --init --recursive
          git submodule update --remote
      - name: Build for d1xks
        run: |
          ./workflows.sh -m d1xks -k Y -r N || { echo "== diag"; ls toolchain/neutron_18/bin | head -50; toolchain/neutron_18/bin/ld.lld -v; ldd toolchain/neutron_18/bin/ld.lld; exit 1; }
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExtremeKRNL-Nexus-d1xks
          path: build/out/d1xks/zip
