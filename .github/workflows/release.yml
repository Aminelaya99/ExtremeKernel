name: Publish build as Release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Kernel Build Workflow run id to publish"
        required: true
        default: "44663117770"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Download build artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ inputs.run_id }}" --repo "${{ github.repository }}" -n ExtremeKRNL-Nexus-sixteen-d1xks -D out
          ls -la out
          (cd out && sha256sum *.img | tee SHA256SUMS)
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="d1xks-caps-run${{ inputs.run_id }}"
          gh release delete "$tag" --repo "${{ github.repository }}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" out/boot.img out/dtb.img out/dtbo.img out/SHA256SUMS \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "d1xks kernel with capabilities 38-40 (run ${{ inputs.run_id }})" \
            --notes "ExtremeKRNL sixteen for d1xks with CAP_PERFMON/CAP_BPF/CAP_CHECKPOINT_RESTORE backported (Android 17 native app zygote fix)."
